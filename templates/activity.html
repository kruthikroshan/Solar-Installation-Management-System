{% extends 'base.html' %}{% block title %}Alerts{% endblock %}
{% block body %}<div class="head"><div><h1>Alerts</h1><p class="muted">What happened in the business that concerns your role.</p></div></div>
<div class="card"><table>{% for r in rows %}<tr><td class="muted" style="width:150px">{{ r.ts|dt }}</td><td>{{ r.message }}</td></tr>{% else %}<tr><td>Nothing yet.</td></tr>{% endfor %}</table></div>{% endblock %}
