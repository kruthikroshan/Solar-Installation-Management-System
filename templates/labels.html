{% extends 'base.html' %}{% block title %}QR labels{% endblock %}
{% block body %}<div class="head noprint"><div><h1>QR labels</h1><p class="muted">Print and stick on each unit. Scanning the label fills the serial in the dispatch screen.</p></div><button onclick="window.print()">Print labels</button></div>
<div class="qrgrid">{% for r in rows %}<div><img src="{{ url_for('qr', serial=r.serial) }}" alt="QR {{ r.serial }}"><br><b>{{ r.serial }}</b><br>{{ r.name }}</div>{% else %}<p>No unlabelled stock.</p>{% endfor %}</div>{% endblock %}
